services:
  - type: web
    name: verdant-laravel-app
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-ap-northeast-1.pooler.supabase.com
      - key: DB_PORT
        value: "6543"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.htxnahpmdzbszkpkqhtv
      - key: DB_PASSWORD
        value: LeUF0f8ytVHCjjFt
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: file
